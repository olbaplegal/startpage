<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
:root, [data-theme="yotsuba"] {
  --bg: #ffe; --bg-top: #fca; --text: #800; --muted: #800;
  --link: #800; --link-hover: #e00; --box-bg: #fff; --box-border: #800;
  --hd-bg: #fca; --hd-text: #800; --tag: #f00; --input-bg: #fff; --footer-link: #00e;
}
[data-theme="yotsuba-b"] {
  --bg: #eef2ff; --bg-top: #d1d5ee; --text: #000; --muted: #34345c;
  --link: #34345c; --link-hover: #d00; --box-bg: #fff; --box-border: #34345c;
  --hd-bg: #d1d5ee; --hd-text: #0f0c5d; --tag: #d00; --input-bg: #fff; --footer-link: #00e;
}
[data-theme="dark"] {
  --bg: #1d1f21; --bg-top: #282a2e; --text: #c5c8c6; --muted: #c5c8c6;
  --link: #81a2be; --link-hover: #5f89ac; --box-bg: #1d1f21; --box-border: #444;
  --hd-bg: #282a2e; --hd-text: #c5c8c6; --tag: #cc6666; --input-bg: #282a2e; --footer-link: #81a2be;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--text);
  background: linear-gradient(var(--bg-top) 0, var(--bg) 200px) var(--bg) no-repeat;
  font: 12px arial, helvetica, sans-serif; min-height: 100vh;
}
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); }
#wrap { width: 750px; max-width: calc(100% - 32px); margin: 0 auto; padding-bottom: 40px; }

#logo { text-align: center; padding: 18px 0 14px; }
#logo h1 {
  margin: 0; font: bold 52px/1 tahoma, arial, sans-serif; letter-spacing: -3px; color: var(--text);
}
#greet { margin-top: 6px; font-size: 13px; color: var(--muted); }
#title:empty, #greet:empty, #frame-title:empty { display: none; }
/* with no title, the greeting takes the title's place */
#logo.notitle #greet { margin-top: 0; font: bold 34px/1.1 tahoma, arial, sans-serif; letter-spacing: -1px; color: var(--text); }

.box { border: 1px solid var(--box-border); background: var(--box-bg); margin-bottom: 6px; }
.hd { background: var(--hd-bg); display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; gap: 8px; }
.hd h2 { margin: 0; font: bold 17px arial, sans-serif; color: var(--hd-text); }
.bd { padding: 6px; }

/* fixed, equal-width columns like 4chan's board list */
/* column count is computed from the box width (see renderSites) so the board is always filled */
#cols { display: grid; grid-template-columns: repeat(var(--cols, 5), minmax(0, 1fr)); column-gap: 0; }
#cols > .col { padding-right: 6px; min-width: 0; overflow-wrap: break-word; }
.cat { margin-bottom: 6px; }
.cat h3 { margin: 0 0 2px; font-size: 12px; font-weight: bold; text-decoration: underline; }
.cat h3 .tag { color: var(--tag); font-size: 10px; text-decoration: none; display: inline-block; margin-left: 3px; }
.cat ul { list-style: none; margin: 0; padding: 0; }
.cat li { line-height: 16px; }

/* picture frame between Sites and Stats (test) */
/* optional picture between Sites and Stats (Options > Image) */
#pic-box { margin-bottom: 6px; border: 1px solid var(--box-border); }
#pic-box[hidden] { display: none; }
#pic-box img { display: block; width: 100%; object-fit: cover; }
#statrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 6px 10px; padding: 6px; }
#statrow h3 { margin: 0 0 2px; font-size: 12px; font-weight: bold; text-decoration: underline; }
#statrow h3 .city { font-weight: normal; text-decoration: none; }
#statrow ul { list-style: none; margin: 0; padding: 0; }
#statrow li { line-height: 16px; }
#statrow b { color: var(--text); }

#tabs { border-top: 1px solid var(--box-border); text-align: center; margin-top: 6px; font-size: 0; }
#tabs a {
  display: inline-block; font-size: 12px; border: 1px solid var(--box-border); border-top: 0;
  padding: 3px 12px; margin-left: -1px; background: var(--box-bg); cursor: pointer;
}
#tabs a.on { background: var(--hd-bg); font-weight: bold; }

#panel { margin-top: 10px; }

/* options popup */
#options-pop {
  display: none; position: fixed; z-index: 20; width: 580px; max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px); flex-direction: column; margin: 0;
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
}
#options-pop.on { display: flex; }
#options-pop > .hd { cursor: move; user-select: none; touch-action: none; }
#options-pop > .bd { overflow-y: auto; }
#opt-close { cursor: pointer; font-weight: bold; font-size: 13px; }
#panel .box { display: none; }
#panel .box.on { display: block; }
#tabs a[data-p="options"].on { background: var(--hd-bg); font-weight: bold; }
textarea, select, input[type=text], input[type=number] {
  border: 1px solid var(--box-border); background: var(--input-bg); color: var(--text);
  font: 12px arial, sans-serif; padding: 3px;
}
textarea { width: 100%; resize: vertical; }
#notes { height: 180px; }
button {
  font: 12px arial, sans-serif; color: var(--link); background: var(--hd-bg);
  border: 1px solid var(--box-border); padding: 2px 10px; cursor: pointer;
}
button:hover { color: var(--link-hover); }
.muted { opacity: .7; font-size: 11px; }

#todo-list { list-style: none; padding: 0; margin: 6px 0 0; }
#todo-list li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
#todo-list li.done span { text-decoration: line-through; opacity: .6; }
#todo-list li .x { margin-left: auto; cursor: pointer; color: var(--tag); }
#todo-form { display: flex; gap: 4px; }
#todo-form input { flex: 1; }

.opt { display: grid; grid-template-columns: 170px 1fr; gap: 6px 10px; align-items: center; }
.opt label.k { font-weight: bold; }
.opt .full { grid-column: 1 / -1; }
.opt .sub { padding-left: 10px; margin-top: -2px; }
#opt-stats > label { display: block; line-height: 19px; }
/* per-stat settings: collapsible, only shown while that stat is enabled */
.sset { display: none; margin: 1px 0 5px 22px; padding: 4px 6px; border-left: 2px solid var(--hd-bg); }
.sset.open { display: block; }
/* settings of an unchecked stat stay visible but look and act disabled */
.sset.off { opacity: .45; }
.srow { display: flex; align-items: center; line-height: 19px; }
/* arrow that turns from right to down when the settings are expanded */
.tog { background: none; border: 0; padding: 0 6px; margin-left: 2px; cursor: pointer; line-height: 0; color: var(--link); }
.tog::before {
  content: ''; display: inline-block; border: 4px solid transparent; border-left: 6px solid currentColor; border-right: 0;
  transition: transform .15s ease;
}
.tog[aria-expanded="true"]::before { transform: rotate(90deg); }
.tog:hover { color: var(--link-hover); }
/* collapsible headers: arrow on the right, like "filter ▼" */
details.drop > summary { cursor: pointer; user-select: none; list-style: none; }
details.drop > summary::-webkit-details-marker { display: none; }
details.drop > summary::after {
  content: ''; display: inline-block; margin-left: 6px; vertical-align: 1px;
  border: 4px solid transparent; border-left: 6px solid currentColor; border-right: 0; transition: transform .15s ease;
}
details.drop[open] > summary::after { transform: rotate(90deg); }
#stats-det[open] > summary, #pic-det[open] > summary { margin-bottom: 4px; }
.pic-opts { display: grid; gap: 4px; }
.pic-opts .row { display: flex; align-items: center; gap: 6px; }
/* line between the Sites (JSON) label and its textarea */
.opt .sep { border-bottom: 1px solid var(--box-border); padding-bottom: 3px; margin-top: 4px; }
.picrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.picrow #opt-pic { flex: 1; min-width: 160px; }
#wx-fields { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 1px 16px; margin-top: 2px; }
.sset .row { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
/* list editors (rates, time zones, countdowns) */
.elist { list-style: none; margin: 0 0 4px; padding: 0; }
.elist li { line-height: 18px; }
.elist .x { color: var(--tag); cursor: pointer; margin-left: 6px; }
.eadd { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 2px; }
.eadd .code { width: 70px; text-transform: uppercase; }
#tz-in { width: 220px; }
#opt-country { width: 50px; text-transform: uppercase; }
#opt-sites { height: 260px; font-family: monospace; font-size: 11px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#opt-msg { margin-left: 6px; }

kbd { border: 1px solid var(--box-border); padding: 0 4px; font-size: 11px; background: var(--hd-bg); }
.keys td { padding: 2px 10px 2px 0; }

footer { text-align: center; margin-top: 24px; font-size: 11px; }
footer a { color: var(--footer-link); text-decoration: underline; cursor: pointer; }
footer a:hover { color: var(--link-hover); }
footer p { margin: 6px 0; }

/* filter dropdown */
.filter { position: relative; font-size: 12px; }
.filter > a { cursor: pointer; user-select: none; }
#filter-menu {
  display: none; position: absolute; right: 0; top: 18px; z-index: 10; min-width: 120px;
  background: var(--box-bg); border: 1px solid #aaa; box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 3px 0;
}
#filter-menu.on { display: block; }
#filter-menu label { display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
#filter-menu label:hover { background: var(--hd-bg); }
#filter-menu input { display: none; }
#filter-menu .ck { width: 10px; display: inline-block; }

/* frame (sidebar) */
#frame {
  display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 200px; overflow-y: auto;
  background: var(--bg); border-right: 1px solid var(--box-border); font-size: 12px; z-index: 5;
}
body.frames #frame { display: block; }
body.frames { padding-left: 200px; }
#frame .flogo { text-align: center; padding: 10px 0 6px; font: bold 22px tahoma, arial, sans-serif; letter-spacing: -1px; }
#frame .fopts { padding: 4px 8px 10px; }
#frame .fopts a { display: block; line-height: 17px; cursor: pointer; }
#frame .fhd {
  display: flex; justify-content: space-between; align-items: center; background: var(--hd-bg);
  border-top: 1px solid var(--box-border); border-bottom: 1px solid var(--box-border); padding: 3px 4px; font-weight: bold;
}
#frame .fhd button { padding: 0 5px; line-height: 12px; font-size: 11px; }
#frame-list { list-style: none; margin: 0; padding: 6px 8px; }
#frame-list li { line-height: 15px; }
#frame-list.hidden { display: none; }

@media (max-width: 600px) {
  #logo h1 { font-size: 40px; }
  .opt { grid-template-columns: 1fr; }
  #tabs a { padding: 3px 8px; }
  body.frames { padding-left: 0; }
  body.frames #frame { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--box-border); max-height: 40vh; }
}
</style>
</head>
<body>
<aside id="frame">
  <div class="flogo" id="frame-title">startpage</div>
  <div class="fopts">
    <a id="fr-remove" data-i18n="frRemove"></a>
  </div>
  <div class="fhd"><span>Sites</span><button id="frame-toggle" data-i18n-title="collapse">−</button></div>
  <ul id="frame-list"></ul>
</aside>
<div id="wrap">
  <header id="logo">
    <h1 id="title">startpage</h1>
    <div id="greet"></div>
  </header>

  <section class="box">
    <div class="hd">
      <h2>Sites</h2>
      <span class="filter">
        <a id="filter-btn" data-i18n="filter"></a>
        <div id="filter-menu">
          <label><input type="checkbox" id="use-frames"><span class="ck"></span> <span data-i18n="useFrames"></span></label>
        </div>
      </span>
    </div>
    <div class="bd">
      <div id="cols"></div>
    </div>
  </section>

  <section id="pic-box" hidden>
    <img id="pic" alt="">
  </section>

  <section class="box" id="stats-box">
    <div class="hd"><h2>Stats</h2></div>
    <div id="statrow"></div>
  </section>

  <nav id="tabs">
    <a data-p="notes" data-i18n="notes"></a><a data-p="todo" data-i18n="todo"></a><a data-p="keys" data-i18n="keys"></a><a data-p="options" data-i18n="options"></a>
  </nav>

  <div id="panel">
    <section class="box" id="p-notes">
      <div class="hd"><h2 data-i18n="notes"></h2><span class="muted" data-i18n="autosave"></span></div>
      <div class="bd"><textarea id="notes" data-i18n-ph="notesPh"></textarea></div>
    </section>

    <section class="box" id="p-todo">
      <div class="hd"><h2 data-i18n="todo"></h2><a id="todo-clear" class="muted" href="#" data-i18n="clearDone"></a></div>
      <div class="bd">
        <form id="todo-form"><input id="todo-in" type="text" data-i18n-ph="todoPh"><button data-i18n="add"></button></form>
        <ul id="todo-list"></ul>
      </div>
    </section>

    <section class="box" id="p-keys">
      <div class="hd"><h2 data-i18n="keys"></h2></div>
      <div class="bd">
        <table class="keys">
          <tr><td><kbd>n</kbd> / <kbd>t</kbd> / <kbd>o</kbd></td><td data-i18n="keyPanels"></td></tr>
          <tr><td><kbd>f</kbd></td><td data-i18n="keyFrame"></td></tr>
          <tr><td><kbd>Esc</kbd></td><td data-i18n="keyEsc"></td></tr>
        </table>
      </div>
    </section>

  </div>

  <footer>
    <p><a id="f-export" data-i18n="export"></a> • <a id="f-import" data-i18n="import"></a> • <a href="https://github.com/olbaplegal/startpage" target="_blank" rel="noopener">About</a> • <a href="https://github.com/olbaplegal/startpage/issues" target="_blank" rel="noopener">Feedback</a></p>
  </footer>
</div>

<section class="box" id="options-pop" role="dialog" aria-labelledby="opt-h">
  <div class="hd" id="opt-drag"><h2 id="opt-h" data-i18n="options"></h2><a id="opt-close" data-i18n-title="close">[x]</a></div>
  <div class="bd">
    <div class="opt">
      <label class="k" for="opt-title" data-i18n="optTitle"></label>
      <input id="opt-title" type="text">
      <label class="k" for="opt-name" data-i18n="optName"></label>
      <input id="opt-name" type="text" data-i18n-ph="optNamePh">
      <label class="k" for="opt-lang" data-i18n="optLang"></label>
      <select id="opt-lang">
        <option value="pt">Português</option>
        <option value="en">English</option>
      </select>
      <label class="k" for="opt-theme" data-i18n="optTheme"></label>
      <select id="opt-theme">
        <option value="yotsuba" data-i18n="themeY"></option>
        <option value="yotsuba-b" data-i18n="themeB"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
      <label class="k" for="opt-newtab" data-i18n="optNewTab"></label>
      <span><input id="opt-newtab" type="checkbox"></span>
      <details class="full drop" id="pic-det"><summary><b data-i18n="optPic"></b></summary>
      <div class="sub pic-opts">
        <div class="picrow">
          <input id="opt-pic" type="text" data-i18n-ph="optPicPh">
          <button id="opt-pic-file" type="button" data-i18n="optPicFile"></button>
          <button id="opt-pic-clear" type="button" data-i18n="remove"></button>
          <input id="pic-file" type="file" accept="image/*" hidden>
        </div>
        <label class="row"><span data-i18n="optPicRatio"></span>
          <select id="opt-pic-ratio">
            <option value="" data-i18n="ratioOrig"></option>
            <option value="16 / 9">16:9</option>
            <option value="4 / 3">4:3</option>
            <option value="1 / 1">1:1</option>
          </select>
        </label>
      </div>
      </details>
      <details class="full drop" id="stats-det"><summary><b data-i18n="optStats"></b></summary>
      <div id="opt-stats" class="sub">
        <label><input type="checkbox" value="clock"> <span data-i18n-stat="clock"></span></label>
        <div class="srow"><label><input type="checkbox" value="tz"> <span data-i18n-stat="tz"></span></label><button type="button" class="tog" data-for="tz" aria-expanded="false" data-i18n-title="settings"></button></div>
        <div class="sset" data-for="tz">
          <ul class="elist" id="tz-list"></ul>
          <div class="eadd">
            <input id="tz-in" type="text" list="tz-codes" placeholder="Asia/Tokyo">
            <button id="tz-add-btn" type="button" data-i18n="add"></button>
          </div>
          <datalist id="tz-codes"></datalist>
        </div>
        <label><input type="checkbox" value="date"> <span data-i18n-stat="date"></span></label>
        <div class="srow"><label><input type="checkbox" value="countdown"> <span data-i18n-stat="countdown"></span></label><button type="button" class="tog" data-for="countdown" aria-expanded="false" data-i18n-title="settings"></button></div>
        <div class="sset" data-for="countdown">
          <ul class="elist" id="cd-list"></ul>
          <div class="eadd">
            <input id="cd-label" type="text" data-i18n-ph="cdLabelPh">
            <input id="cd-date" type="date">
            <button id="cd-add-btn" type="button" data-i18n="add"></button>
          </div>
        </div>
        <div class="srow"><label><input type="checkbox" value="holiday"> <span data-i18n-stat="holiday"></span></label><button type="button" class="tog" data-for="holiday" aria-expanded="false" data-i18n-title="settings"></button></div>
        <div class="sset" data-for="holiday">
          <label class="row"><span data-i18n="optCountry"></span> <input id="opt-country" type="text" maxlength="2" placeholder="BR"></label>
          <div class="muted" data-i18n="optCountryHint"></div>
        </div>
        <div class="srow"><label><input type="checkbox" value="weather"> <span data-i18n-stat="weather"></span></label><button type="button" class="tog" data-for="weather" aria-expanded="false" data-i18n-title="settings"></button></div>
        <div class="sset" data-for="weather">
          <label class="row"><span data-i18n="optCity"></span> <input id="opt-city" type="text" data-i18n-ph="optCityPh"></label>
          <div class="muted" data-i18n="wxShow"></div>
          <div id="wx-fields">
            <label><input type="checkbox" value="now"> <span data-i18n-wx="now"></span></label>
            <label><input type="checkbox" value="hilo"> <span data-i18n-wx="hilo"></span></label>
            <label><input type="checkbox" value="feels"> <span data-i18n-wx="feels"></span></label>
            <label><input type="checkbox" value="rain"> <span data-i18n-wx="rain"></span></label>
            <label><input type="checkbox" value="uv"> <span data-i18n-wx="uv"></span></label>
            <label><input type="checkbox" value="humidity"> <span data-i18n-wx="humidity"></span></label>
            <label><input type="checkbox" value="wind"> <span data-i18n-wx="wind"></span></label>
            <label><input type="checkbox" value="sun"> <span data-i18n-wx="sun"></span></label>
          </div>
        </div>
        <div class="srow"><label><input type="checkbox" value="currency"> <span data-i18n-stat="currency"></span></label><button type="button" class="tog" data-for="currency" aria-expanded="false" data-i18n-title="settings"></button></div>
        <div class="sset" data-for="currency">
          <ul class="elist" id="cur-list"></ul>
          <div class="eadd">
            <input id="cur-from" class="code" type="text" list="cur-codes" maxlength="5" placeholder="USDT">
            <span>/</span>
            <input id="cur-to" class="code" type="text" list="cur-codes" maxlength="5" placeholder="BRL">
            <button id="cur-add-btn" type="button" data-i18n="add"></button>
          </div>
          <div class="muted" data-i18n="curHint"></div>
          <datalist id="cur-codes"></datalist>
        </div>
        <label><input type="checkbox" value="todos"> <span data-i18n-stat="todos"></span></label>
        <label><input type="checkbox" value="uptime"> <span data-i18n-stat="uptime"></span></label>
      </div>
      </details>
      <label class="k full sep" for="opt-sites">Sites (JSON) <span class="muted">— <code data-i18n="optSitesFmt"></code></span></label>
      <textarea id="opt-sites" class="full" spellcheck="false"></textarea>
    </div>
    <div class="btns">
      <button id="opt-save" data-i18n="save"></button>
      <button id="opt-export" data-i18n="export"></button>
      <button id="opt-import" data-i18n="import"></button>
      <button id="opt-reset" data-i18n="reset"></button>
      <span id="opt-msg"></span>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>
</section>

<script>
const I18N = {
  pt: {
    locale: 'pt-BR',
    filter: 'filtro ▼', useFrames: 'Usar Frames',
    frRemove: '[Remover Frames]',
    collapse: 'recolher', close: 'fechar',
    notes: 'Notas', todo: 'Tarefas', keys: 'Atalhos', options: 'Options',
    autosave: 'salva automaticamente', notesPh: 'Rascunhos, links, lembretes…',
    clearDone: 'limpar concluídas', todoPh: 'Nova tarefa…', add: 'Adicionar', remove: 'remover', nothing: 'Nada pendente.',
    keyPanels: 'abre Notas / Tarefas / Options', keyFrame: 'liga/desliga o frame lateral', keyEsc: 'fecha painel / menu do filtro / Options',
    optTitle: 'Título', optName: 'Seu nome (saudação)', optNamePh: 'vazio = sem saudação', optLang: 'Idioma',
    optTheme: 'Tema', themeY: 'Yotsuba (bege)', themeB: 'Yotsuba B (azul)', themeDark: 'Escuro',
    optNewTab: 'Links em nova aba', optCity: 'Cidade', optCityPh: 'ex: São Paulo',
    settings: 'configurações', optCountry: 'País', optCountryHint: 'código de 2 letras: BR, US, PT…',
    optTz: 'Fusos extras', optCd: 'Contagem regressiva', cdLabelPh: 'Nome, ex.: Férias', badTz: 'Fuso inválido.', badCd: 'Preencha nome e data.',
    noItems: 'Nenhum item.', today: 'hoje!', past: 'passou',

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

if (typeof cfg.currency === 'string') { // single pair from older versions
  cfg.currencies = [cfg.currency.split('-')];
  delete cfg.currency;
}
if ((saved.statsVersion || 1) < 2) { // stats added in v2 start enabled
  for (const k of ['tz', 'countdown', 'holiday', 'weatherDetail', 'rain']) if (!cfg.stats.includes(k)) cfg.stats.push(k);
}
if ((saved.statsVersion || 1) < 3) { // v3: weather details and rain became fields of the weather stat
  const had = (k) => cfg.stats.includes(k);
  const fields = [...(had('weather') ? ['now'] : []), ...(had('weatherDetail') ? ['hilo', 'feels', 'uv'] : []), ...(had('rain') ? ['rain'] : [])];
  if (fields.length) {
    cfg.weatherFields = WX_FIELDS.filter((f) => fields.includes(f));
    if (!had('weather')) cfg.stats.push('weather');
  }
  cfg.stats = cfg.stats.filter((k) => STAT_KEYS.includes(k));
  cfg.stats.sort((a, b) => STAT_KEYS.indexOf(a) - STAT_KEYS.indexOf(b));
  cfg.statsVersion = 3;
  store.set('sp.config', cfg);
}
if (saved.sitesVersion !== SITES_VERSION) {
  cfg.sites = structuredClone(DEFAULTS.sites);
  cfg.sitesVersion = SITES_VERSION;
  store.set('sp.config', cfg);
}

function renderPic() {

function siteLink(name, url) {
  const a = document.createElement('a');
  a.textContent = name; a.href = url;
  if (cfg.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

function renderFrame() {
  const ul = $('#frame-list');
  ul.innerHTML = '';
  for (const g of cfg.sites) {
    for (const [name, url] of g.links || []) {
      const li = document.createElement('li');
      li.append(siteLink(name, url));
      ul.append(li);
    }
  }
}

// as many columns as fit (min 109px each, like 4chan), but never more than there are categories
const MIN_COL = 109;
function siteColCount() {
  const w = $('#cols').clientWidth || 738;
  return Math.max(1, Math.min(cfg.sites.length, Math.floor(w / MIN_COL)));
}
function refitSites() {
  if (siteColCount() !== $('#cols').querySelectorAll(':scope > .col').length) renderSites();
}
if (window.ResizeObserver) new ResizeObserver(refitSites).observe($('#cols'));
else addEventListener('resize', refitSites);

function renderSites() {
  const box = $('#cols');
  box.innerHTML = '';
  // one div per column; each category goes to the currently shortest column
  const n = siteColCount();
  box.style.setProperty('--cols', n);
  const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; box.append(c); return c; });
  const heights = new Array(n).fill(0);
  for (const g of cfg.sites) {
    const div = document.createElement('div');
    div.className = 'cat';
    const h = document.createElement('h3');
    if (g.url) h.append(siteLink(g.cat, g.url)); else h.textContent = g.cat;
    if (g.tag) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = `(${g.tag})`; h.append(t); }
    const ul = document.createElement('ul');
    for (const [name, url] of g.links || []) {
      const li = document.createElement('li');
      li.append(siteLink(name, url)); ul.append(li);
    }
    div.append(h, ul);
    const i = heights.indexOf(Math.min(...heights));
    cols[i].append(div);
    heights[i] += (g.links?.length || 0) + 1.5;
  }
}

function greet() {
  const h = new Date().getHours();
  const p = L().greet[h < 5 ? 0 : h < 12 ? 1 : h < 18 ? 2 : 3];

/* ---------- stats ---------- */
const statCache = { wx: {}, holiday: null, cur: {} };

// stats are shown in columns, one per group, in this order
const STAT_GROUPS = {
  time: ['clock', 'tz', 'date'],
  dates: ['countdown', 'holiday'],
  weather: ['weather'],
  currency: ['currency'],
  misc: ['todos', 'uptime'],
};

function statRows(k) {
  const t = L();
  if (k === 'currency') return cfg.currencies.map(([f, to], i) => [`${f}/${to}`, `cur-${i}`]);
  if (k === 'tz') return cfg.timezones.map((z, i) => [tzName(z), `tz-${i}`]);
  if (k === 'countdown') return cfg.countdowns.map(([name], i) => [name, `cd-${i}`]);
  if (k === 'weather') return WX_FIELDS.filter((f) => cfg.weatherFields.includes(f)).map((f) => [t.wx[f], `wx-${f}`]);
  return [[t.statLabels[k] || t.stats[k], k]];
}

function renderStats() {
  const row = $('#statrow');
  row.innerHTML = '';
  statCache.wx = {};
  statCache.holiday = null;
  statCache.cur = {};
  statCache.city = '';
  const t = L();
  let any = false;
  for (const [g, keys] of Object.entries(STAT_GROUPS)) {
    const rows = keys.filter((k) => cfg.stats.includes(k)).flatMap(statRows);
    if (!rows.length) continue;
    any = true;
    const col = document.createElement('div');
    const h = document.createElement('h3');
    h.textContent = t.groups[g];
    if (g === 'weather') { const c = document.createElement('span'); c.className = 'city'; c.id = 'st-city'; h.append(' ', c); }
    const ul = document.createElement('ul');
    for (const [label, id] of rows) {
      const li = document.createElement('li');
      const b = document.createElement('b');
      b.textContent = label + ':';
      const v = document.createElement('span');
      v.id = 'st-' + id;
      li.append(b, ' ', v);
      ul.append(li);
    }
    col.append(h, ul);
    row.append(col);
  }
  $('#stats-box').style.display = any ? '' : 'none';
  tick();
  if (cfg.stats.includes('weather') && cfg.weatherFields.length) loadWeather();
  if (cfg.stats.includes('holiday')) loadHoliday();
  if (cfg.stats.includes('currency')) loadCurrency();
}

const tzName = (z) => z.split('/').pop().replace(/_/g, ' ');

function isoDay(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function daysUntil(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  const now = new Date();
  return Math.round((new Date(y, m - 1, d) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
}
function countdownText(n) { const t = L(); return n === 0 ? t.today : n < 0 ? t.past : t.days(n); }

function setStat(k, v) { const el = document.getElementById('st-' + k); if (el) el.textContent = v; }

function tick() {
  const now = new Date();
  const t = L();
  setStat('clock', now.toLocaleTimeString(t.locale));
  setStat('date', now.toLocaleDateString(t.locale, { weekday: 'short', day: '2-digit', month: 'short' }));
  setStat('todos', t.pending(todos.filter((x) => !x.done).length));
  const m = Math.floor((Date.now() - openedAt) / 60000);
  setStat('uptime', m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`);
  cfg.timezones.forEach((z, i) => {
    try { setStat('tz-' + i, now.toLocaleTimeString(t.locale, { timeZone: z, hour: '2-digit', minute: '2-digit' })); }
    catch { setStat('tz-' + i, t.unavailable); }
  });
  cfg.countdowns.forEach(([, d], i) => setStat('cd-' + i, countdownText(daysUntil(d))));
  const h = statCache.holiday;
  setStat('holiday', !h ? '…' : h.err ? t.unavailable
    : `${cfg.lang === 'en' ? h.name : h.localName}, ${new Date(h.date + 'T12:00').toLocaleDateString(t.locale, { day: '2-digit', month: '2-digit' })} (${countdownText(daysUntil(h.date))})`);
  for (const f of WX_FIELDS) setStat('wx-' + f, statCache.wx[f] ?? '…');
  setStat('city', statCache.city ? `(${statCache.city})` : '');
  cfg.currencies.forEach((_, i) => setStat('cur-' + i, statCache.cur[i] ?? '…'));
}

async function cached(key, ttlMs, fn) {
  const c = store.get(key);
  if (c && Date.now() - c.t < ttlMs) return c.v;
  const v = await fn();
  store.set(key, { t: Date.now(), v });
  return v;
}

async function loadWeather() {
  const fill = (v) => { for (const f of WX_FIELDS) statCache.wx[f] = v; };
  if (!cfg.city) { fill('—'); return tick(); }
  try {
    const loc = await cached('sp.geo.' + cfg.lang + '.' + cfg.city, 30 * 864e5, async () => {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=${cfg.lang}&name=${encodeURIComponent(cfg.city)}`);
      const j = await r.json();
      if (!j.results?.length) throw new Error('cidade não encontrada');
      const { latitude, longitude, name } = j.results[0];
      return { latitude, longitude, name };
    });
    const j = await cached('sp.wx3.' + cfg.city, 15 * 60e3, async () => {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}`
        + '&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,wind_speed_10m'
        + '&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset'
        + '&forecast_days=1&timezone=auto');
      const { current, daily } = await r.json();
      return { current, daily };
    });
    const t = L(), c = j.current, d = j.daily, r0 = (x) => Math.round(x);
    statCache.city = loc.name;
    const hm = (iso) => iso.slice(11, 16);
    statCache.wx = {
      now: `${r0(c.temperature_2m)}°C, ${t.wmo[c.weather_code] ?? ''}`,
      hilo: `${r0(d.temperature_2m_max[0])}°/${r0(d.temperature_2m_min[0])}°`,
      feels: `${r0(c.apparent_temperature)}°`,
      rain: `${d.precipitation_probability_max[0] ?? 0}% ${t.rainToday}`,
      uv: String(r0(d.uv_index_max[0])),
      humidity: `${c.relative_humidity_2m}%`,
      wind: `${r0(c.wind_speed_10m)} km/h`,
      sun: `${hm(d.sunrise[0])} / ${hm(d.sunset[0])}`,
    };
  } catch (e) { fill(L().unavailable); }
  tick();
}

async function loadHoliday() {
  try {
    const today = isoDay(new Date()), y = new Date().getFullYear();
    let next = null;
    for (const year of [y, y + 1]) {
      const list = await cached(`sp.hol.${cfg.country}.${year}`, 7 * 864e5, async () => {
        const r = await fetch(`https://date.nager.at/api/v3/PublicHolidays/${year}/${cfg.country}`);
        if (!r.ok) throw new Error('bad country');
        return (await r.json()).map(({ date, localName, name }) => ({ date, localName, name }));
      });
      next = list.find((h) => h.date >= today);
      if (next) break;
    }
    statCache.holiday = next || { err: true };
  } catch (e) { statCache.holiday = { err: true }; }
  tick();
}

// crypto prices come from CoinGecko, fiat-to-fiat from AwesomeAPI
const CRYPTO = {
  BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether', USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
  XRP: 'ripple', DOGE: 'dogecoin', LTC: 'litecoin', ADA: 'cardano', TRX: 'tron', DOT: 'polkadot',
};
const FIAT = ['BRL', 'USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'ARS', 'MXN'];

async function coingecko(coin, vs) {
  const id = CRYPTO[coin], q = vs.toLowerCase();
  const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=${q}&include_24hr_change=true`);
  const j = (await r.json())[id] || {};
  if (j[q] == null) throw new Error('unsupported pair');
  return { v: j[q], pct: j[q + '_24h_change'] ?? 0 };
}

async function fetchRate(from, to) {
  if (CRYPTO[from]) {
    try { return await coingecko(from, to); } catch (e) { if (!CRYPTO[to]) throw e; }
  }
  if (CRYPTO[to]) {
    const r = await coingecko(to, from);
    return { v: 1 / r.v, pct: (100 / (1 + r.pct / 100)) - 100 };
  }
  const r = await fetch(`https://economia.awesomeapi.com.br/json/last/${from}-${to}`);
  const j = (await r.json())[from + to];
  if (!j) throw new Error('unsupported pair');
  return { v: parseFloat(j.bid), pct: parseFloat(j.pctChange) };
}

function fmtRate(v, to) {
  const loc = L().locale;
  const digits = v >= 1 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumSignificantDigits: 4 };
  if (!CRYPTO[to]) {
    try { return v.toLocaleString(loc, { style: 'currency', currency: to, ...digits }); } catch {}
  }
  return `${v.toLocaleString(loc, digits)} ${to}`;
}

function loadCurrency() {
  cfg.currencies.forEach(async ([from, to], i) => {
    try {
      const r = await cached(`sp.rate.${from}-${to}`, 30 * 60e3, () => fetchRate(from, to));
      statCache.cur[i] = `${fmtRate(r.v, to)} (${r.pct.toLocaleString(L().locale, { signDisplay: 'always', minimumFractionDigits: 2, maximumFractionDigits: 2 })}%)`;
    } catch (e) { statCache.cur[i] = L().unavailable; }
    tick();
  });
}

setInterval(tick, 1000);
setInterval(greet, 60e3);

/* ---------- filter menu / frame ---------- */
const filterMenu = $('#filter-menu');

function syncFilterMenu() {
  for (const [id, key] of [['use-frames', 'useFrames']]) {
    const cb = document.getElementById(id);
    cb.checked = !!cfg[key];
    cb.nextElementSibling.textContent = cb.checked ? '✔' : '';
  }
}

function setFlag(key, val) {
  cfg[key] = val;
  store.set('sp.config', cfg);
  document.body.classList.toggle('frames', cfg.useFrames);
  syncFilterMenu();
}

$('#filter-btn').addEventListener('click', (e) => { e.stopPropagation(); filterMenu.classList.toggle('on'); });
filterMenu.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => filterMenu.classList.remove('on'));
$('#use-frames').addEventListener('change', (e) => setFlag('useFrames', e.target.checked));

$('#frame-toggle').addEventListener('click', () => {
  const hidden = $('#frame-list').classList.toggle('hidden');
  $('#frame-toggle').textContent = hidden ? '+' : '−';
});

// frame options: placeholders, not implemented yet
for (const id of ['fr-remove']) {
  document.getElementById(id).addEventListener('click', (e) => e.preventDefault());
}


/* ---------- tabs / panels ---------- */
function openPanel(p) {
  if (p === 'options') return toggleOptions();
  const already = $(`#p-${p}`).classList.contains('on');
  document.querySelectorAll('#panel .box').forEach((b) => b.classList.remove('on'));
  document.querySelectorAll('#tabs a:not([data-p="options"])').forEach((a) => a.classList.remove('on'));
  if (already) return;
  $(`#p-${p}`).classList.add('on');
  $(`#tabs a[data-p="${p}"]`).classList.add('on');
  if (p === 'notes') $('#notes').focus();
  if (p === 'todo') $('#todo-in').focus();
  $(`#p-${p}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
document.querySelectorAll('#tabs a[data-p]').forEach((a) => a.addEventListener('click', () => openPanel(a.dataset.p)));


document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  // Esc: first press leaves the field being typed in, the next closes the panel
  if (e.key === 'Escape' && typing) { document.activeElement.blur(); return; }
  if (e.key === 'Escape') {
    filterMenu.classList.remove('on');
    if (pop.classList.contains('on')) closeOptions();
    else document.querySelectorAll('#panel .box.on, #tabs a.on').forEach((x) => x.classList.remove('on'));
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'f') { e.preventDefault(); setFlag('useFrames', !cfg.useFrames); }
  else if (e.key === 'n') { e.preventDefault(); openPanel('notes'); }
  else if (e.key === 't') { e.preventDefault(); openPanel('todo'); }
  else if (e.key === 'o') { e.preventDefault(); openPanel('options'); }
});

/* ---------- notes ---------- */
const notes = $('#notes');
notes.value = store.get('sp.notes', '');
notes.addEventListener('input', () => store.set('sp.notes', notes.value));

/* ---------- todo ---------- */
function saveTodos() { store.set('sp.todos', todos); renderTodos(); tick(); }
function renderTodos() {
  const ul = $('#todo-list');
  ul.innerHTML = '';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = () => { todos[i].done = cb.checked; saveTodos(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '[x]'; x.title = L().remove;
    x.onclick = () => { todos.splice(i, 1); saveTodos(); };
    li.append(cb, sp, x); ul.append(li);
  });
  if (!todos.length) ul.innerHTML = `<li class="muted">${L().nothing}</li>`;
}
$('#todo-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#todo-in').value.trim();
  if (!v) return;
  todos.push({ text: v, done: false });
  $('#todo-in').value = '';
  saveTodos();
});
$('#todo-clear').addEventListener('click', (e) => { e.preventDefault(); todos = todos.filter((t) => !t.done); saveTodos(); });

/* ---------- options popup ---------- */
const pop = $('#options-pop');

function clampPop(x, y) {
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.max(0, Math.min(x, innerWidth - r.width)) + 'px';
  pop.style.top = Math.max(0, Math.min(y, innerHeight - r.height)) + 'px';
}
function openOptions() {
  fillOptions();
  pop.classList.add('on');
  $('#tabs a[data-p="options"]').classList.add('on');
  if (!pop.dataset.placed) {
    const r = pop.getBoundingClientRect();
    clampPop((innerWidth - r.width) / 2, Math.max(16, (innerHeight - r.height) / 2));
    pop.dataset.placed = '1';
  } else clampPop(pop.offsetLeft, pop.offsetTop);
}
function closeOptions() {
  pop.classList.remove('on');
  $('#tabs a[data-p="options"]').classList.remove('on');
}
function toggleOptions() { pop.classList.contains('on') ? closeOptions() : openOptions(); }
$('#opt-close').addEventListener('click', closeOptions);
addEventListener('resize', () => { if (pop.classList.contains('on')) clampPop(pop.offsetLeft, pop.offsetTop); });

$('#opt-drag').addEventListener('pointerdown', (e) => {
  if (e.target.closest('#opt-close') || e.button !== 0) return;
  const dx = e.clientX - pop.offsetLeft, dy = e.clientY - pop.offsetTop;
  const h = e.currentTarget;
  h.setPointerCapture(e.pointerId);
  const move = (ev) => clampPop(ev.clientX - dx, ev.clientY - dy);
  const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', up);
  h.addEventListener('pointercancel', up);
});

/* ---------- options ---------- */
const statChecks = () => document.querySelectorAll('#opt-stats > label > input, #opt-stats > .srow > label > input');

// a stat's settings block is visible only while one of its stats is checked
function syncStatSettings() {
  const on = new Set([...statChecks()].filter((c) => c.checked).map((c) => c.value));
  document.querySelectorAll('.sset').forEach((el) => {
    const off = !on.has(el.dataset.for);
    el.classList.toggle('off', off);
    el.inert = off;
  });
}
statChecks().forEach((cb) => cb.addEventListener('change', syncStatSettings));

function setStatOpen(k, open) {
  $(`.tog[data-for="${k}"]`).setAttribute('aria-expanded', open);
  $(`.sset[data-for="${k}"]`).classList.toggle('open', open);
}
document.querySelectorAll('.tog').forEach((b) => b.addEventListener('click', () => {
  setStatOpen(b.dataset.for, b.getAttribute('aria-expanded') !== 'true');
}));

function fillOptions() {
  $('#opt-lang').value = cfg.lang;
  $('#opt-title').value = cfg.title;
  $('#opt-name').value = cfg.name;
  $('#opt-theme').value = cfg.theme;
  $('#opt-newtab').checked = cfg.newTab;
  picDraft = { url: cfg.picUrl, data: null };
  showPicDraft();
  $('#opt-pic-ratio').value = cfg.picRatio;
  $('#stats-det').open = false;
  $('#pic-det').open = false;
  $('#opt-city').value = cfg.city;
  $('#opt-country').value = cfg.country;
  curDraft = cfg.currencies.map((p) => [...p]);
  tzDraft = [...cfg.timezones];
  cdDraft = cfg.countdowns.map((p) => [...p]);
  renderEditors();
  $('#opt-sites').value = JSON.stringify(cfg.sites, null, 2);
  statChecks().forEach((cb) => { cb.checked = cfg.stats.includes(cb.value); });
  document.querySelectorAll('#wx-fields input').forEach((cb) => { cb.checked = cfg.weatherFields.includes(cb.value); });
  document.querySelectorAll('.tog').forEach((b) => setStatOpen(b.dataset.for, false));
  syncStatSettings();
  $('#opt-msg').textContent = '';
}

let curDraft = [];
$('#cur-codes').innerHTML = [...Object.keys(CRYPTO), ...FIAT].map((c) => `<option value="${c}">`).join('');

let tzDraft = [], cdDraft = [];
try { $('#tz-codes').innerHTML = ['UTC', ...Intl.supportedValuesOf('timeZone')].map((z) => `<option value="${z}">`).join(''); } catch {}

function renderList(ul, arr, fmt) {
  ul.innerHTML = '';
  arr.forEach((item, i) => {
    const li = document.createElement('li');
    const x = document.createElement('a');
    x.className = 'x'; x.textContent = '[x]'; x.title = L().remove;
    x.onclick = () => { arr.splice(i, 1); renderList(ul, arr, fmt); };
    li.append(fmt(item), x);
    ul.append(li);
  });
  if (!arr.length) ul.innerHTML = `<li class="muted">${L().noItems}</li>`;
}
function renderEditors() {
  renderList($('#cur-list'), curDraft, ([f, t]) => `${f}/${t}`);
  renderList($('#tz-list'), tzDraft, (z) => `${tzName(z)} (${z})`);
  renderList($('#cd-list'), cdDraft, ([n, d]) => `${n} — ${new Date(d + 'T12:00').toLocaleDateString(L().locale)}`);
}
function onEnter(ids, fn) {
  for (const id of ids) $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); fn(); } });
}

function addTz() {
  const z = $('#tz-in').value.trim();
  try { new Intl.DateTimeFormat('en', { timeZone: z }); } catch { return msg(L().badTz); }
  if (!z) return msg(L().badTz);
  if (!tzDraft.includes(z)) tzDraft.push(z);
  $('#tz-in').value = '';
  renderEditors();
}
$('#tz-add-btn').addEventListener('click', addTz);
onEnter(['#tz-in'], addTz);

function addCd() {
  const n = $('#cd-label').value.trim(), d = $('#cd-date').value;
  if (!n || !/^\d{4}-\d{2}-\d{2}$/.test(d)) return msg(L().badCd);
  cdDraft.push([n, d]);
  cdDraft.sort((a, b) => a[1].localeCompare(b[1]));
  $('#cd-label').value = $('#cd-date').value = '';
  renderEditors();
}
$('#cd-add-btn').addEventListener('click', addCd);
onEnter(['#cd-label', '#cd-date'], addCd);

function addPair() {
  const f = $('#cur-from').value.trim().toUpperCase(), t = $('#cur-to').value.trim().toUpperCase();
  if (!/^[A-Z]{2,5}$/.test(f) || !/^[A-Z]{2,5}$/.test(t) || f === t) return msg(L().badPair);
  if (!curDraft.some(([a, b]) => a === f && b === t)) curDraft.push([f, t]);
  $('#cur-from').value = $('#cur-to').value = '';
  renderEditors();
  $('#cur-from').focus();
}
$('#cur-add-btn').addEventListener('click', addPair);
onEnter(['#cur-from', '#cur-to'], addPair);

// image option: a typed URL, or an uploaded file (stored as a data URL on save)
let picDraft = { url: '', data: null };
function showPicDraft() {
  const local = picDraft.url.startsWith('local:');
  $('#opt-pic').value = local ? '' : picDraft.url;
  $('#opt-pic').placeholder = local ? L().picLocal + picDraft.url.slice(6) : L().optPicPh;
}
$('#opt-pic').addEventListener('input', (e) => { picDraft = { url: e.target.value.trim(), data: null }; });
$('#opt-pic-file').addEventListener('click', () => $('#pic-file').click());
$('#pic-file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 3e6) return msg(L().picTooBig);
  const r = new FileReader();
  r.onload = () => { picDraft = { url: 'local:' + f.name, data: r.result }; showPicDraft(); };
  r.readAsDataURL(f);
});
$('#opt-pic-clear').addEventListener('click', () => { picDraft = { url: '', data: null }; showPicDraft(); });

function msg(t) { $('#opt-msg').textContent = t; setTimeout(() => { $('#opt-msg').textContent = ''; }, 3000); }

function validSites(s) {
  return Array.isArray(s) && s.every((g) => typeof g.cat === 'string' && Array.isArray(g.links)
    && g.links.every((l) => Array.isArray(l) && l.length === 2 && l.every((x) => typeof x === 'string')));
}

function commit(next) {
  cfg = next;
  store.set('sp.config', cfg);
  applyConfig();
}

$('#opt-save').addEventListener('click', () => {
  let sites;
  try { sites = JSON.parse($('#opt-sites').value); } catch (e) { return msg(L().badJson + e.message); }
  if (!validSites(sites)) return msg(L().badSites);
  if (picDraft.data) {
    try { localStorage.setItem('sp.picdata', JSON.stringify(picDraft.data)); } catch { return msg(L().picTooBig); }
  } else if (!picDraft.url.startsWith('local:')) store.set('sp.picdata', '');
  commit({
    ...cfg,
    title: $('#opt-title').value.trim(),
    name: $('#opt-name').value.trim(),
    lang: $('#opt-lang').value,
    theme: $('#opt-theme').value,
    newTab: $('#opt-newtab').checked,
    picUrl: picDraft.url,
    picRatio: $('#opt-pic-ratio').value,
    city: $('#opt-city').value.trim(),
    currencies: curDraft.map((p) => [...p]),
    timezones: [...tzDraft],
    countdowns: cdDraft.map((p) => [...p]),
    country: ($('#opt-country').value.trim() || DEFAULTS.country).toUpperCase(),
    stats: [...statChecks()].filter((c) => c.checked).map((c) => c.value),
    weatherFields: [...document.querySelectorAll('#wx-fields input:checked')].map((c) => c.value),
    sites,
  });
  fillOptions();
  msg(L().saved);
});

$('#opt-reset').addEventListener('click', () => {
  if (!confirm(L().confirmReset)) return;
  commit(structuredClone(DEFAULTS));
  fillOptions();
  msg(L().restored);
});

function exportAll() {
  const data = { config: cfg, notes: notes.value, todos, picdata: store.get('sp.picdata', '') };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'startpage-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importAll() { $('#import-file').click(); }
$('#import-file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.config) {
      if (d.config.sites && !validSites(d.config.sites)) throw new Error(L().badSites);
      commit({ ...structuredClone(DEFAULTS), ...d.config });
    }
    if (typeof d.picdata === 'string') { store.set('sp.picdata', d.picdata); renderPic(); }
    if (typeof d.notes === 'string') { notes.value = d.notes; store.set('sp.notes', d.notes); }
    if (Array.isArray(d.todos)) { todos = d.todos; saveTodos(); }
    if (pop.classList.contains('on')) fillOptions();
    msg(L().imported);
  } catch (err) { alert(L().importFail + err.message); }
  e.target.value = '';
});
$('#opt-export').addEventListener('click', exportAll);
$('#opt-import').addEventListener('click', importAll);
$('#f-export').addEventListener('click', exportAll);
$('#f-import').addEventListener('click', importAll);

/* ---------- init ---------- */
applyConfig();
</script>
