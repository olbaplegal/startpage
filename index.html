<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<style>
:root, [data-theme="yotsuba"] {
  --bg: #ffe; --bg-top: #fca; --text: #800; --muted: #800;
  --link: #800; --link-hover: #e00; --box-bg: #fff; --box-border: #800;
  --hd-bg: #fca; --hd-text: #800; --tag: #f00; --input-bg: #fff; --footer-link: #00e;
}
[data-theme="yotsuba-b"] {
  --bg: #eef2ff; --bg-top: #d1d5ee; --text: #000; --muted: #34345c;
  --link: #34345c; --link-hover: #d00; --box-bg: #fff; --box-border: #34345c;
  --hd-bg: #d1d5ee; --hd-text: #0f0c5d; --tag: #d00; --input-bg: #fff; --footer-link: #00e;
}
[data-theme="dark"] {
  --bg: #1d1f21; --bg-top: #282a2e; --text: #c5c8c6; --muted: #c5c8c6;
  --link: #81a2be; --link-hover: #5f89ac; --box-bg: #1d1f21; --box-border: #444;
  --hd-bg: #282a2e; --hd-text: #c5c8c6; --tag: #cc6666; --input-bg: #282a2e; --footer-link: #81a2be;
}
* { box-sizing: border-box; }
body {
  margin: 0; color: var(--text);
  background: linear-gradient(var(--bg-top) 0, var(--bg) 200px) var(--bg) no-repeat;
  font: 12px arial, helvetica, sans-serif; min-height: 100vh;
}
a { color: var(--link); text-decoration: none; }
a:hover { color: var(--link-hover); }
#wrap { width: 750px; max-width: calc(100% - 32px); margin: 0 auto; padding-bottom: 40px; }

#logo { text-align: center; padding: 18px 0 14px; }
#logo h1 {
  margin: 0; font: bold 52px/1 tahoma, arial, sans-serif; letter-spacing: -3px; color: var(--text);
}
#greet { margin-top: 6px; font-size: 13px; color: var(--muted); }

.box { border: 1px solid var(--box-border); background: var(--box-bg); margin-bottom: 6px; }
.hd { background: var(--hd-bg); display: flex; align-items: center; justify-content: space-between; padding: 4px 6px; gap: 8px; }
.hd h2 { margin: 0; font: bold 17px arial, sans-serif; color: var(--hd-text); }
.bd { padding: 6px; }

#cols { column-gap: 8px; }
.cat { break-inside: avoid; margin-bottom: 6px; }
.cat h3 { margin: 0 0 2px; font-size: 12px; font-weight: bold; text-decoration: underline; }
.cat h3 .tag { color: var(--tag); font-size: 10px; text-decoration: none; display: inline-block; margin-left: 3px; }
.cat ul { list-style: none; margin: 0; padding: 0; }
.cat li { line-height: 16px; }

#statrow { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 4px 16px; padding: 8px 6px; }
#statrow b { color: var(--text); }
#statrow .stat { white-space: nowrap; }

#tabs { border-top: 1px solid var(--box-border); text-align: center; margin-top: 6px; font-size: 0; }
#tabs a {
  display: inline-block; font-size: 12px; border: 1px solid var(--box-border); border-top: 0;
  padding: 3px 12px; margin-left: -1px; background: var(--box-bg); cursor: pointer;
}
#tabs a.on { background: var(--hd-bg); font-weight: bold; }

#panel { margin-top: 10px; }

/* options popup */
#options-pop {
  display: none; position: fixed; z-index: 20; width: 580px; max-width: calc(100vw - 32px);
  max-height: calc(100vh - 32px); flex-direction: column; margin: 0;
  box-shadow: 0 3px 12px rgba(0,0,0,.35);
}
#options-pop.on { display: flex; }
#options-pop > .hd { cursor: move; user-select: none; touch-action: none; }
#options-pop > .bd { overflow-y: auto; }
#opt-close { cursor: pointer; font-weight: bold; font-size: 13px; }
#panel .box { display: none; }
#panel .box.on { display: block; }
#tabs a[data-p="options"].on { background: var(--hd-bg); font-weight: bold; }
textarea, select, input[type=text], input[type=number] {
  border: 1px solid var(--box-border); background: var(--input-bg); color: var(--text);
  font: 12px arial, sans-serif; padding: 3px;
}
textarea { width: 100%; resize: vertical; }
#notes { height: 180px; }
button {
  font: 12px arial, sans-serif; color: var(--link); background: var(--hd-bg);
  border: 1px solid var(--box-border); padding: 2px 10px; cursor: pointer;
}
button:hover { color: var(--link-hover); }
.muted { opacity: .7; font-size: 11px; }

#todo-list { list-style: none; padding: 0; margin: 6px 0 0; }
#todo-list li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
#todo-list li.done span { text-decoration: line-through; opacity: .6; }
#todo-list li .x { margin-left: auto; cursor: pointer; color: var(--tag); }
#todo-form { display: flex; gap: 4px; }
#todo-form input { flex: 1; }

.opt { display: grid; grid-template-columns: 170px 1fr; gap: 6px 10px; align-items: center; }
.opt label.k { font-weight: bold; }
.opt .full { grid-column: 1 / -1; }
.arr { width: 1.05em; height: .7em; margin: 0 .2em; vertical-align: 0; }
.opt .sub { padding-left: 10px; margin-top: -2px; }
#opt-stats { display: grid; grid-template-columns: repeat(3, auto); justify-content: start; gap: 3px 18px; }
#cur-list { list-style: none; margin: 0 0 4px; padding: 0; }
#cur-list li { line-height: 18px; }
#cur-list .x { color: var(--tag); cursor: pointer; margin-left: 6px; }
#cur-add { display: flex; align-items: center; gap: 4px; margin-bottom: 2px; }
#cur-add input { width: 70px; text-transform: uppercase; }
#opt-sites { height: 260px; font-family: monospace; font-size: 11px; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
#opt-msg { margin-left: 6px; }

kbd { border: 1px solid var(--box-border); padding: 0 4px; font-size: 11px; background: var(--hd-bg); }
.keys td { padding: 2px 10px 2px 0; }

footer { text-align: center; margin-top: 24px; font-size: 11px; }
footer a { color: var(--footer-link); text-decoration: underline; cursor: pointer; }
footer a:hover { color: var(--link-hover); }
footer p { margin: 6px 0; }

/* filter dropdown */
.filter { position: relative; font-size: 12px; }
.filter > a { cursor: pointer; user-select: none; }
#filter-menu {
  display: none; position: absolute; right: 0; top: 18px; z-index: 10; min-width: 120px;
  background: var(--box-bg); border: 1px solid #aaa; box-shadow: 0 1px 3px rgba(0,0,0,.2); padding: 3px 0;
}
#filter-menu.on { display: block; }
#filter-menu label { display: flex; align-items: center; gap: 6px; padding: 3px 10px; cursor: pointer; font-size: 13px; color: var(--text); white-space: nowrap; }
#filter-menu label:hover { background: var(--hd-bg); }
#filter-menu input { display: none; }
#filter-menu .ck { width: 10px; display: inline-block; }

/* frame (sidebar) */
#frame {
  display: none; position: fixed; left: 0; top: 0; bottom: 0; width: 200px; overflow-y: auto;
  background: var(--bg); border-right: 1px solid var(--box-border); font-size: 12px; z-index: 5;
}
body.frames #frame { display: block; }
body.frames { padding-left: 200px; }
#frame .flogo { text-align: center; padding: 10px 0 6px; font: bold 22px tahoma, arial, sans-serif; letter-spacing: -1px; }
#frame .fopts { padding: 4px 8px 10px; }
#frame .fopts a { display: block; line-height: 17px; cursor: pointer; }
#frame .fhd {
  display: flex; justify-content: space-between; align-items: center; background: var(--hd-bg);
  border-top: 1px solid var(--box-border); border-bottom: 1px solid var(--box-border); padding: 3px 4px; font-weight: bold;
}
#frame .fhd button { padding: 0 5px; line-height: 12px; font-size: 11px; }
#frame-list { list-style: none; margin: 0; padding: 6px 8px; }
#frame-list li { line-height: 15px; }
#frame-list.hidden { display: none; }

@media (max-width: 600px) {
  #logo h1 { font-size: 40px; }
  .opt { grid-template-columns: 1fr; }
  #opt-stats { grid-template-columns: repeat(2, auto); }
  #tabs a { padding: 3px 8px; }
  body.frames { padding-left: 0; }
  body.frames #frame { position: static; width: auto; border-right: 0; border-bottom: 1px solid var(--box-border); max-height: 40vh; }
}
</style>
</head>
<body>
<aside id="frame">
  <div class="flogo" id="frame-title">startpage</div>
  <div class="fopts">
    <a id="fr-remove" data-i18n="frRemove"></a>
    <a id="fr-hidedirs" data-i18n="frHideDirs"></a>
    <a id="fr-worksafe" data-i18n="frWorksafe"></a>
  </div>
  <div class="fhd"><span>Sites</span><button id="frame-toggle" data-i18n-title="collapse">−</button></div>
  <ul id="frame-list"></ul>
</aside>
<div id="wrap">
  <header id="logo">
    <h1 id="title">startpage</h1>
    <div id="greet"></div>
  </header>

  <section class="box">
    <div class="hd">
      <h2>Sites</h2>
      <span class="filter">
        <a id="filter-btn" data-i18n="filter"></a>
        <div id="filter-menu">
          <label><input type="checkbox" id="use-frames"><span class="ck"></span> <span data-i18n="useFrames"></span></label>
          <label><input type="checkbox" id="use-catalog"><span class="ck"></span> <span data-i18n="useCatalog"></span></label>
        </div>
      </span>
    </div>
    <div class="bd">
      <div id="cols"></div>
    </div>
  </section>

  <section class="box" id="stats-box">
    <div class="hd"><h2>Stats</h2></div>
    <div id="statrow"></div>
  </section>

  <nav id="tabs">
    <a data-p="notes" data-i18n="notes"></a><a data-p="todo" data-i18n="todo"></a><a data-p="keys" data-i18n="keys"></a><a data-p="options" data-i18n="options"></a>
  </nav>

  <div id="panel">
    <section class="box" id="p-notes">
      <div class="hd"><h2 data-i18n="notes"></h2><span class="muted" data-i18n="autosave"></span></div>
      <div class="bd"><textarea id="notes" data-i18n-ph="notesPh"></textarea></div>
    </section>

    <section class="box" id="p-todo">
      <div class="hd"><h2 data-i18n="todo"></h2><a id="todo-clear" class="muted" href="#" data-i18n="clearDone"></a></div>
      <div class="bd">
        <form id="todo-form"><input id="todo-in" type="text" data-i18n-ph="todoPh"><button data-i18n="add"></button></form>
        <ul id="todo-list"></ul>
      </div>
    </section>

    <section class="box" id="p-keys">
      <div class="hd"><h2 data-i18n="keys"></h2></div>
      <div class="bd">
        <table class="keys">
          <tr><td><kbd>n</kbd> / <kbd>t</kbd> / <kbd>o</kbd></td><td data-i18n="keyPanels"></td></tr>
          <tr><td><kbd>f</kbd></td><td data-i18n="keyFrame"></td></tr>
          <tr><td><kbd>Esc</kbd></td><td data-i18n="keyEsc"></td></tr>
        </table>
      </div>
    </section>

  </div>

  <footer>
    <p><a id="f-export" data-i18n="export"></a> • <a id="f-import" data-i18n="import"></a> • <a href="https://github.com/olbaplegal/startpage" target="_blank" rel="noopener">About</a> • <a href="https://github.com/olbaplegal/startpage/issues" target="_blank" rel="noopener">Feedback</a></p>
  </footer>
</div>

<section class="box" id="options-pop" role="dialog" aria-labelledby="opt-h">
  <div class="hd" id="opt-drag"><h2 id="opt-h" data-i18n="options"></h2><a id="opt-close" data-i18n-title="close">[x]</a></div>
  <div class="bd">
    <div class="opt">
      <label class="k" for="opt-title" data-i18n="optTitle"></label>
      <input id="opt-title" type="text">
      <label class="k" for="opt-name" data-i18n="optName"></label>
      <input id="opt-name" type="text" data-i18n-ph="optNamePh">
      <label class="k" for="opt-lang" data-i18n="optLang"></label>
      <select id="opt-lang">
        <option value="pt">Português</option>
        <option value="en">English</option>
      </select>
      <label class="k" for="opt-theme" data-i18n="optTheme"></label>
      <select id="opt-theme">
        <option value="yotsuba" data-i18n="themeY"></option>
        <option value="yotsuba-b" data-i18n="themeB"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
      <label class="k" for="opt-cols" data-i18n="optCols"></label>
      <input id="opt-cols" type="number" min="1" max="8">
      <label class="k" for="opt-newtab" data-i18n="optNewTab"></label>
      <span><input id="opt-newtab" type="checkbox"></span>
      <label class="k" for="opt-city" data-i18n="optCity"></label>
      <input id="opt-city" type="text" data-i18n-ph="optCityPh">
      <label class="k full" for="cur-from" data-i18n="optCur"></label>
      <div class="full sub">
        <ul id="cur-list"></ul>
        <div id="cur-add">
          <input id="cur-from" type="text" list="cur-codes" maxlength="5" placeholder="USDT">
          <svg class="arr" viewBox="0 0 12 8" aria-hidden="true"><path d="M0 4h10M7 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <input id="cur-to" type="text" list="cur-codes" maxlength="5" placeholder="BRL">
          <button id="cur-add-btn" type="button" data-i18n="add"></button>
        </div>
        <div class="muted" data-i18n="curHint"></div>
        <datalist id="cur-codes"></datalist>
      </div>
      <span class="k full"><b data-i18n="optStats"></b></span>
      <div id="opt-stats" class="full sub"></div>
      <label class="k full" for="opt-sites">Sites (JSON) <span class="muted">— <code data-i18n="optSitesFmt"></code></span></label>
      <textarea id="opt-sites" class="full" spellcheck="false"></textarea>
    </div>
    <div class="btns">
      <button id="opt-save" data-i18n="save"></button>
      <button id="opt-export" data-i18n="export"></button>
      <button id="opt-import" data-i18n="import"></button>
      <button id="opt-reset" data-i18n="reset"></button>
      <span id="opt-msg"></span>
    </div>
    <input id="import-file" type="file" accept="application/json" hidden>
  </div>
</section>

<script>
const I18N = {
  pt: {
    locale: 'pt-BR',
    filter: 'filtro ▼', useFrames: 'Usar Frames', useCatalog: 'Usar Catálogo',
    frRemove: '[Remover Frames]', frHideDirs: '[Esconder Diretórios]', frWorksafe: '[Mostrar Só Worksafe]',
    collapse: 'recolher', close: 'fechar',
    notes: 'Notas', todo: 'Tarefas', keys: 'Atalhos', options: 'Options',
    autosave: 'salva automaticamente', notesPh: 'Rascunhos, links, lembretes…',
    clearDone: 'limpar concluídas', todoPh: 'Nova tarefa…', add: 'Adicionar', remove: 'remover', nothing: 'Nada pendente.',
    keyPanels: 'abre Notas / Tarefas / Options', keyFrame: 'liga/desliga o frame lateral', keyEsc: 'fecha painel / menu do filtro / Options',
    optTitle: 'Título', optName: 'Seu nome (saudação)', optNamePh: 'vazio = sem saudação', optLang: 'Idioma',
    optTheme: 'Tema', themeY: 'Yotsuba (bege)', themeB: 'Yotsuba B (azul)', themeDark: 'Escuro',
    optCols: 'Colunas', optNewTab: 'Links em nova aba', optCity: 'Cidade (clima)', optCityPh: 'ex: São Paulo',
    optCur: 'Cotações', curHint: 'Fiat (USD, EUR, BRL…) e cripto (BTC, ETH, USDT, SOL…). Ex.: USDT/BRL, USDT/BTC.', noPairs: 'Nenhuma cotação.', badPair: 'Código de moeda inválido.', optStats: 'Stats visíveis',
    optSitesFmt: '[{"cat": "Nome", "url": "opcional", "tag": "opcional", "links": [["Título", "https://…"]]}]',
    save: 'Salvar', export: 'Exportar', import: 'Importar', reset: 'Restaurar padrão',
    saved: 'Salvo.', restored: 'Padrão restaurado.', imported: 'Importado.',
    badJson: 'JSON inválido: ', badSites: 'Formato de sites inválido.', importFail: 'Falha ao importar: ',
    confirmReset: 'Restaurar todas as configurações padrão? (notas e tarefas são mantidas)',
    unavailable: 'indisponível',
    greet: ['Boa madrugada', 'Bom dia', 'Boa tarde', 'Boa noite'],
    pending: (n) => `${n} pendente${n === 1 ? '' : 's'}`,
    stats: { clock: 'Hora', date: 'Data', weather: 'Clima', currency: 'Cotações', todos: 'Tarefas', uptime: 'Aberto há' },
    wmo: { 0: 'limpo', 1: 'quase limpo', 2: 'parc. nublado', 3: 'nublado', 45: 'neblina', 48: 'neblina',
      51: 'garoa', 53: 'garoa', 55: 'garoa', 61: 'chuva fraca', 63: 'chuva', 65: 'chuva forte',
      80: 'pancadas', 81: 'pancadas', 82: 'temporal', 95: 'trovoadas', 96: 'trovoadas', 99: 'trovoadas' },
  },
  en: {
    locale: 'en-US',
    filter: 'filter ▼', useFrames: 'Use Frames', useCatalog: 'Use Catalog',
    frRemove: '[Remove Frames]', frHideDirs: '[Hide Directories]', frWorksafe: '[Show Worksafe Only]',
    collapse: 'collapse', close: 'close',
    notes: 'Notes', todo: 'Tasks', keys: 'Shortcuts', options: 'Options',
    autosave: 'saved automatically', notesPh: 'Drafts, links, reminders…',
    clearDone: 'clear completed', todoPh: 'New task…', add: 'Add', remove: 'remove', nothing: 'Nothing pending.',
    keyPanels: 'opens Notes / Tasks / Options', keyFrame: 'toggles the side frame', keyEsc: 'closes panel / filter menu / Options',
    optTitle: 'Title', optName: 'Your name (greeting)', optNamePh: 'empty = no greeting', optLang: 'Language',
    optTheme: 'Theme', themeY: 'Yotsuba (beige)', themeB: 'Yotsuba B (blue)', themeDark: 'Dark',
    optCols: 'Columns', optNewTab: 'Open links in new tab', optCity: 'City (weather)', optCityPh: 'e.g. London',
    optCur: 'Currency rates', curHint: 'Fiat (USD, EUR, BRL…) and crypto (BTC, ETH, USDT, SOL…). E.g. USDT/BRL, USDT/BTC.', noPairs: 'No rates.', badPair: 'Invalid currency code.', optStats: 'Visible stats',
    optSitesFmt: '[{"cat": "Name", "url": "optional", "tag": "optional", "links": [["Title", "https://…"]]}]',
    save: 'Save', export: 'Export', import: 'Import', reset: 'Restore defaults',
    saved: 'Saved.', restored: 'Defaults restored.', imported: 'Imported.',
    badJson: 'Invalid JSON: ', badSites: 'Invalid sites format.', importFail: 'Import failed: ',
    confirmReset: 'Restore all default settings? (notes and tasks are kept)',
    unavailable: 'unavailable',
    greet: ['Good night', 'Good morning', 'Good afternoon', 'Good evening'],
    pending: (n) => `${n} pending`,
    stats: { clock: 'Time', date: 'Date', weather: 'Weather', currency: 'Rates', todos: 'Tasks', uptime: 'Open for' },
    wmo: { 0: 'clear', 1: 'mostly clear', 2: 'partly cloudy', 3: 'overcast', 45: 'fog', 48: 'fog',
      51: 'drizzle', 53: 'drizzle', 55: 'drizzle', 61: 'light rain', 63: 'rain', 65: 'heavy rain',
      80: 'showers', 81: 'showers', 82: 'storm', 95: 'thunderstorm', 96: 'thunderstorm', 99: 'thunderstorm' },
  },
};
const STAT_KEYS = Object.keys(I18N.pt.stats);
const L = () => I18N[cfg.lang] || I18N.pt;

function applyLang() {
  const t = L();
  document.documentElement.lang = t.locale;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t[el.dataset.i18n]; });
  document.querySelectorAll('[data-i18n-ph]').forEach((el) => { el.placeholder = t[el.dataset.i18nPh]; });
  document.querySelectorAll('[data-i18n-title]').forEach((el) => { el.title = t[el.dataset.i18nTitle]; });
}

// bump when DEFAULTS.sites changes, so saved configs pick up the new list
const SITES_VERSION = 2;

const DEFAULTS = {
  title: 'startpage',
  name: '',
  lang: 'pt',
  theme: 'yotsuba',
  cols: 5,
  newTab: false,
  city: 'São Paulo',
  currencies: [['USD', 'BRL'], ['USDT', 'BRL'], ['USDT', 'BTC']],
  stats: ['clock', 'date', 'weather', 'currency', 'todos'],
  useFrames: false,
  useCatalog: false,
  sitesVersion: SITES_VERSION,
  sites: [
    { cat: 'Reddit', url: 'https://www.reddit.com', links: [
      ['r/visualnovels', 'https://www.reddit.com/r/visualnovels/'],
      ['r/linuxmemes', 'https://www.reddit.com/r/linuxmemes/'],
      ['r/linuxsucks', 'https://www.reddit.com/r/linuxsucks/'],
      ['r/unixporn', 'https://www.reddit.com/r/unixporn/'],
    ]},
    { cat: '4chan', url: 'https://www.4chan.org', links: [
      ['/lit/ - Literature', 'https://boards.4chan.org/lit/'],
      ['/a/ - Anime & Manga', 'https://boards.4chan.org/a/'],
      ['/tv/ - Television & Film', 'https://boards.4chan.org/tv/'],
    ]},
    { cat: 'Mídia', links: [
      ['YouTube', 'https://www.youtube.com'],
      ['Twitch', 'https://www.twitch.tv'],
    ]},
    { cat: 'Comunicação', links: [
      ['Gmail', 'https://mail.google.com'],
      ['WhatsApp', 'https://web.whatsapp.com'],
      ['LinkedIn', 'https://www.linkedin.com'],
    ]},
    { cat: 'Dev', links: [
      ['GitHub', 'https://github.com'],
      ['ArchWiki', 'https://wiki.archlinux.org'],
    ]},
    { cat: 'Prática', links: [
      ['Chess', 'https://www.chess.com'],
      ['Monkeytype', 'https://monkeytype.com'],
    ]},
  ],
};

const $ = (s) => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let cfg = { ...structuredClone(DEFAULTS), ...store.get('sp.config', {}) };
cfg.stats = cfg.stats.filter((k) => STAT_KEYS.includes(k));
if (typeof cfg.currency === 'string') { // single pair from older versions
  cfg.currencies = [cfg.currency.split('-')];
  delete cfg.currency;
}
if (cfg.sitesVersion !== SITES_VERSION) {
  cfg.sites = structuredClone(DEFAULTS.sites);
  cfg.sitesVersion = SITES_VERSION;
  store.set('sp.config', cfg);
}
let todos = store.get('sp.todos', []);
const openedAt = Date.now();

/* ---------- render ---------- */
function applyConfig() {
  document.documentElement.dataset.theme = cfg.theme;
  applyLang();
  $('#title').textContent = cfg.title;
  document.title = cfg.title;
  $('#cols').style.columnCount = Math.max(1, Math.min(8, +cfg.cols || 5));
  $('#frame-title').textContent = cfg.title;
  renderSites();
  renderFrame();
  renderStats();
  greet();
  document.body.classList.toggle('frames', cfg.useFrames);
  syncFilterMenu();
  renderTodos();
}

function siteLink(name, url) {
  const a = document.createElement('a');
  a.textContent = name; a.href = url;
  if (cfg.newTab) { a.target = '_blank'; a.rel = 'noopener'; }
  return a;
}

function renderFrame() {
  const ul = $('#frame-list');
  ul.innerHTML = '';
  for (const g of cfg.sites) {
    for (const [name, url] of g.links || []) {
      const li = document.createElement('li');
      li.append(siteLink(name, url));
      ul.append(li);
    }
  }
}

function renderSites() {
  const cols = $('#cols');
  cols.innerHTML = '';
  for (const g of cfg.sites) {
    const div = document.createElement('div');
    div.className = 'cat';
    const h = document.createElement('h3');
    if (g.url) h.append(siteLink(g.cat, g.url)); else h.textContent = g.cat;
    if (g.tag) { const t = document.createElement('span'); t.className = 'tag'; t.textContent = `(${g.tag})`; h.append(t); }
    const ul = document.createElement('ul');
    for (const [name, url] of g.links || []) {
      const li = document.createElement('li');
      li.append(siteLink(name, url)); ul.append(li);
    }
    div.append(h, ul);
    cols.append(div);
  }
}

function greet() {
  const h = new Date().getHours();
  const p = L().greet[h < 5 ? 0 : h < 12 ? 1 : h < 18 ? 2 : 3];
  $('#greet').textContent = cfg.name ? `${p}, ${cfg.name}.` : '';
}

/* ---------- stats ---------- */
const statCache = { weather: '…', cur: {} };

function renderStats() {
  const row = $('#statrow');
  row.innerHTML = '';
  statCache.weather = '…';
  statCache.cur = {};
  const items = [];
  for (const k of cfg.stats) {
    if (k === 'currency') cfg.currencies.forEach(([f, t], i) => items.push([[f, arrowEl(), t], `cur-${i}`]));
    else items.push([L().stats[k], k]);
  }
  $('#stats-box').style.display = items.length ? '' : 'none';
  for (const [label, id] of items) {
    const s = document.createElement('span');
    s.className = 'stat';
    const b = document.createElement('b');
    b.append(...[].concat(label), ':');
    const v = document.createElement('span');
    v.id = 'st-' + id;
    s.append(b, ' ', v);
    row.append(s);
  }
  tick();
  if (cfg.stats.includes('weather')) loadWeather();
  if (cfg.stats.includes('currency')) loadCurrency();
}

function arrowEl() {
  const t = document.createElement('template');
  t.innerHTML = '<svg class="arr" viewBox="0 0 12 8" aria-hidden="true"><path d="M0 4h10M7 1l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
  return t.content.firstChild;
}

function setStat(k, v) { const el = document.getElementById('st-' + k); if (el) el.textContent = v; }

function tick() {
  const now = new Date();
  const t = L();
  setStat('clock', now.toLocaleTimeString(t.locale));
  setStat('date', now.toLocaleDateString(t.locale, { weekday: 'short', day: '2-digit', month: 'short' }));
  setStat('todos', t.pending(todos.filter((x) => !x.done).length));
  const m = Math.floor((Date.now() - openedAt) / 60000);
  setStat('uptime', m < 60 ? `${m} min` : `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}`);
  setStat('weather', statCache.weather);
  cfg.currencies.forEach((_, i) => setStat('cur-' + i, statCache.cur[i] ?? '…'));
}

async function cached(key, ttlMs, fn) {
  const c = store.get(key);
  if (c && Date.now() - c.t < ttlMs) return c.v;
  const v = await fn();
  store.set(key, { t: Date.now(), v });
  return v;
}

async function loadWeather() {
  if (!cfg.city) { statCache.weather = '—'; return tick(); }
  try {
    const loc = await cached('sp.geo.' + cfg.lang + '.' + cfg.city, 30 * 864e5, async () => {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=1&language=${cfg.lang}&name=${encodeURIComponent(cfg.city)}`);
      const j = await r.json();
      if (!j.results?.length) throw new Error('cidade não encontrada');
      const { latitude, longitude, name } = j.results[0];
      return { latitude, longitude, name };
    });
    const w = await cached('sp.wx.' + cfg.city, 15 * 60e3, async () => {
      const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,weather_code&timezone=auto`);
      return (await r.json()).current;
    });
    statCache.weather = `${Math.round(w.temperature_2m)}°C ${L().wmo[w.weather_code] ?? ''} (${loc.name})`;
  } catch (e) { statCache.weather = L().unavailable; }
  tick();
}

// crypto prices come from CoinGecko, fiat-to-fiat from AwesomeAPI
const CRYPTO = {
  BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether', USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
  XRP: 'ripple', DOGE: 'dogecoin', LTC: 'litecoin', ADA: 'cardano', TRX: 'tron', DOT: 'polkadot',
};
const FIAT = ['BRL', 'USD', 'EUR', 'GBP', 'JPY', 'CAD', 'AUD', 'CHF', 'CNY', 'ARS', 'MXN'];

async function coingecko(coin, vs) {
  const id = CRYPTO[coin], q = vs.toLowerCase();
  const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=${q}&include_24hr_change=true`);
  const j = (await r.json())[id] || {};
  if (j[q] == null) throw new Error('unsupported pair');
  return { v: j[q], pct: j[q + '_24h_change'] ?? 0 };
}

async function fetchRate(from, to) {
  if (CRYPTO[from]) {
    try { return await coingecko(from, to); } catch (e) { if (!CRYPTO[to]) throw e; }
  }
  if (CRYPTO[to]) {
    const r = await coingecko(to, from);
    return { v: 1 / r.v, pct: (100 / (1 + r.pct / 100)) - 100 };
  }
  const r = await fetch(`https://economia.awesomeapi.com.br/json/last/${from}-${to}`);
  const j = (await r.json())[from + to];
  if (!j) throw new Error('unsupported pair');
  return { v: parseFloat(j.bid), pct: parseFloat(j.pctChange) };
}

function fmtRate(v, to) {
  const loc = L().locale;
  const digits = v >= 1 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumSignificantDigits: 4 };
  if (!CRYPTO[to]) {
    try { return v.toLocaleString(loc, { style: 'currency', currency: to, ...digits }); } catch {}
  }
  return `${v.toLocaleString(loc, digits)} ${to}`;
}

function loadCurrency() {
  cfg.currencies.forEach(async ([from, to], i) => {
    try {
      const r = await cached(`sp.rate.${from}-${to}`, 30 * 60e3, () => fetchRate(from, to));
      statCache.cur[i] = `${fmtRate(r.v, to)} (${r.pct.toLocaleString(L().locale, { signDisplay: 'always', minimumFractionDigits: 2, maximumFractionDigits: 2 })}%)`;
    } catch (e) { statCache.cur[i] = L().unavailable; }
    tick();
  });
}

setInterval(tick, 1000);
setInterval(greet, 60e3);

/* ---------- filter menu / frame ---------- */
const filterMenu = $('#filter-menu');

function syncFilterMenu() {
  for (const [id, key] of [['use-frames', 'useFrames'], ['use-catalog', 'useCatalog']]) {
    const cb = document.getElementById(id);
    cb.checked = !!cfg[key];
    cb.nextElementSibling.textContent = cb.checked ? '✔' : '';
  }
}

function setFlag(key, val) {
  cfg[key] = val;
  store.set('sp.config', cfg);
  document.body.classList.toggle('frames', cfg.useFrames);
  syncFilterMenu();
}

$('#filter-btn').addEventListener('click', (e) => { e.stopPropagation(); filterMenu.classList.toggle('on'); });
filterMenu.addEventListener('click', (e) => e.stopPropagation());
document.addEventListener('click', () => filterMenu.classList.remove('on'));
$('#use-frames').addEventListener('change', (e) => setFlag('useFrames', e.target.checked));
$('#use-catalog').addEventListener('change', (e) => setFlag('useCatalog', e.target.checked)); // TODO: catalog view

$('#frame-toggle').addEventListener('click', () => {
  const hidden = $('#frame-list').classList.toggle('hidden');
  $('#frame-toggle').textContent = hidden ? '+' : '−';
});

// frame options: placeholders, not implemented yet
for (const id of ['fr-remove', 'fr-hidedirs', 'fr-worksafe']) {
  document.getElementById(id).addEventListener('click', (e) => e.preventDefault());
}


/* ---------- tabs / panels ---------- */
function openPanel(p) {
  if (p === 'options') return toggleOptions();
  const already = $(`#p-${p}`).classList.contains('on');
  document.querySelectorAll('#panel .box').forEach((b) => b.classList.remove('on'));
  document.querySelectorAll('#tabs a:not([data-p="options"])').forEach((a) => a.classList.remove('on'));
  if (already) return;
  $(`#p-${p}`).classList.add('on');
  $(`#tabs a[data-p="${p}"]`).classList.add('on');
  if (p === 'notes') $('#notes').focus();
  if (p === 'todo') $('#todo-in').focus();
  $(`#p-${p}`).scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
document.querySelectorAll('#tabs a[data-p]').forEach((a) => a.addEventListener('click', () => openPanel(a.dataset.p)));


document.addEventListener('keydown', (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  // Esc: first press leaves the field being typed in, the next closes the panel
  if (e.key === 'Escape' && typing) { document.activeElement.blur(); return; }
  if (e.key === 'Escape') {
    filterMenu.classList.remove('on');
    if (pop.classList.contains('on')) closeOptions();
    else document.querySelectorAll('#panel .box.on, #tabs a.on').forEach((x) => x.classList.remove('on'));
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'f') { e.preventDefault(); setFlag('useFrames', !cfg.useFrames); }
  else if (e.key === 'n') { e.preventDefault(); openPanel('notes'); }
  else if (e.key === 't') { e.preventDefault(); openPanel('todo'); }
  else if (e.key === 'o') { e.preventDefault(); openPanel('options'); }
});

/* ---------- notes ---------- */
const notes = $('#notes');
notes.value = store.get('sp.notes', '');
notes.addEventListener('input', () => store.set('sp.notes', notes.value));

/* ---------- todo ---------- */
function saveTodos() { store.set('sp.todos', todos); renderTodos(); tick(); }
function renderTodos() {
  const ul = $('#todo-list');
  ul.innerHTML = '';
  todos.forEach((t, i) => {
    const li = document.createElement('li');
    if (t.done) li.className = 'done';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = t.done;
    cb.onchange = () => { todos[i].done = cb.checked; saveTodos(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '[x]'; x.title = L().remove;
    x.onclick = () => { todos.splice(i, 1); saveTodos(); };
    li.append(cb, sp, x); ul.append(li);
  });
  if (!todos.length) ul.innerHTML = `<li class="muted">${L().nothing}</li>`;
}
$('#todo-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('#todo-in').value.trim();
  if (!v) return;
  todos.push({ text: v, done: false });
  $('#todo-in').value = '';
  saveTodos();
});
$('#todo-clear').addEventListener('click', (e) => { e.preventDefault(); todos = todos.filter((t) => !t.done); saveTodos(); });

/* ---------- options popup ---------- */
const pop = $('#options-pop');

function clampPop(x, y) {
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.max(0, Math.min(x, innerWidth - r.width)) + 'px';
  pop.style.top = Math.max(0, Math.min(y, innerHeight - r.height)) + 'px';
}
function openOptions() {
  fillOptions();
  pop.classList.add('on');
  $('#tabs a[data-p="options"]').classList.add('on');
  if (!pop.dataset.placed) {
    const r = pop.getBoundingClientRect();
    clampPop((innerWidth - r.width) / 2, Math.max(16, (innerHeight - r.height) / 2));
    pop.dataset.placed = '1';
  } else clampPop(pop.offsetLeft, pop.offsetTop);
}
function closeOptions() {
  pop.classList.remove('on');
  $('#tabs a[data-p="options"]').classList.remove('on');
}
function toggleOptions() { pop.classList.contains('on') ? closeOptions() : openOptions(); }
$('#opt-close').addEventListener('click', closeOptions);
addEventListener('resize', () => { if (pop.classList.contains('on')) clampPop(pop.offsetLeft, pop.offsetTop); });

$('#opt-drag').addEventListener('pointerdown', (e) => {
  if (e.target.closest('#opt-close') || e.button !== 0) return;
  const dx = e.clientX - pop.offsetLeft, dy = e.clientY - pop.offsetTop;
  const h = e.currentTarget;
  h.setPointerCapture(e.pointerId);
  const move = (ev) => clampPop(ev.clientX - dx, ev.clientY - dy);
  const up = () => { h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up); };
  h.addEventListener('pointermove', move);
  h.addEventListener('pointerup', up);
  h.addEventListener('pointercancel', up);
});

/* ---------- options ---------- */
function fillOptions() {
  $('#opt-lang').value = cfg.lang;
  $('#opt-title').value = cfg.title;
  $('#opt-name').value = cfg.name;
  $('#opt-theme').value = cfg.theme;
  $('#opt-cols').value = cfg.cols;
  $('#opt-newtab').checked = cfg.newTab;
  $('#opt-city').value = cfg.city;
  curDraft = cfg.currencies.map((p) => [...p]);
  renderCurList();
  $('#opt-sites').value = JSON.stringify(cfg.sites, null, 2);
  const box = $('#opt-stats');
  box.innerHTML = '';
  for (const [k, label] of Object.entries(L().stats)) {
    const l = document.createElement('label');
    l.innerHTML = `<input type="checkbox" value="${k}" ${cfg.stats.includes(k) ? 'checked' : ''}> ${label}`;
    box.append(l);
  }
  $('#opt-msg').textContent = '';
}

let curDraft = [];
$('#cur-codes').innerHTML = [...Object.keys(CRYPTO), ...FIAT].map((c) => `<option value="${c}">`).join('');

function renderCurList() {
  const ul = $('#cur-list');
  ul.innerHTML = '';
  curDraft.forEach(([f, t], i) => {
    const li = document.createElement('li');
    const x = document.createElement('a');
    x.className = 'x'; x.textContent = '[x]'; x.title = L().remove;
    x.onclick = () => { curDraft.splice(i, 1); renderCurList(); };
    li.append(f, arrowEl(), t, x);
    ul.append(li);
  });
  if (!curDraft.length) ul.innerHTML = `<li class="muted">${L().noPairs}</li>`;
}

function addPair() {
  const f = $('#cur-from').value.trim().toUpperCase(), t = $('#cur-to').value.trim().toUpperCase();
  if (!/^[A-Z]{2,5}$/.test(f) || !/^[A-Z]{2,5}$/.test(t) || f === t) return msg(L().badPair);
  if (!curDraft.some(([a, b]) => a === f && b === t)) curDraft.push([f, t]);
  $('#cur-from').value = $('#cur-to').value = '';
  renderCurList();
  $('#cur-from').focus();
}
$('#cur-add-btn').addEventListener('click', addPair);
for (const id of ['#cur-from', '#cur-to']) {
  $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addPair(); } });
}

function msg(t) { $('#opt-msg').textContent = t; setTimeout(() => { $('#opt-msg').textContent = ''; }, 3000); }

function validSites(s) {
  return Array.isArray(s) && s.every((g) => typeof g.cat === 'string' && Array.isArray(g.links)
    && g.links.every((l) => Array.isArray(l) && l.length === 2 && l.every((x) => typeof x === 'string')));
}

function commit(next) {
  cfg = next;
  store.set('sp.config', cfg);
  applyConfig();
}

$('#opt-save').addEventListener('click', () => {
  let sites;
  try { sites = JSON.parse($('#opt-sites').value); } catch (e) { return msg(L().badJson + e.message); }
  if (!validSites(sites)) return msg(L().badSites);
  commit({
    ...cfg,
    title: $('#opt-title').value.trim() || DEFAULTS.title,
    name: $('#opt-name').value.trim(),
    lang: $('#opt-lang').value,
    theme: $('#opt-theme').value,
    cols: +$('#opt-cols').value || DEFAULTS.cols,
    newTab: $('#opt-newtab').checked,
    city: $('#opt-city').value.trim(),
    currencies: curDraft.map((p) => [...p]),
    stats: [...document.querySelectorAll('#opt-stats input:checked')].map((i) => i.value),
    sites,
  });
  fillOptions();
  msg(L().saved);
});

$('#opt-reset').addEventListener('click', () => {
  if (!confirm(L().confirmReset)) return;
  commit(structuredClone(DEFAULTS));
  fillOptions();
  msg(L().restored);
});

function exportAll() {
  const data = { config: cfg, notes: notes.value, todos };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'startpage-backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importAll() { $('#import-file').click(); }
$('#import-file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.config) {
      if (d.config.sites && !validSites(d.config.sites)) throw new Error(L().badSites);
      commit({ ...structuredClone(DEFAULTS), ...d.config });
    }
    if (typeof d.notes === 'string') { notes.value = d.notes; store.set('sp.notes', d.notes); }
    if (Array.isArray(d.todos)) { todos = d.todos; saveTodos(); }
    if (pop.classList.contains('on')) fillOptions();
    msg(L().imported);
  } catch (err) { alert(L().importFail + err.message); }
  e.target.value = '';
});
$('#opt-export').addEventListener('click', exportAll);
$('#opt-import').addEventListener('click', importAll);
$('#f-export').addEventListener('click', exportAll);
$('#f-import').addEventListener('click', importAll);

/* ---------- init ---------- */
applyConfig();
</script>
